<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snap Wheel on a desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.sf{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.dark{--label:rgba(255,255,255,.92);--label2:rgba(235,235,245,.64);--hud:rgba(36,36,40,.72);--hair:rgba(255,255,255,.14)}
.light{--label:rgba(0,0,0,.88);--label2:rgba(60,60,67,.74);--hud:rgba(250,250,252,.78);--hair:rgba(0,0,0,.12)}
.ghost{position:absolute;border-radius:10px;box-sizing:border-box;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.dark .ghost{background:rgba(63,211,194,.18);border:1.5px solid rgba(63,211,194,.92);box-shadow:0 0 0 1px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.25)}
.light .ghost{background:rgba(11,122,114,.14);border:1.5px solid rgba(11,122,114,.88);box-shadow:0 0 0 1px rgba(255,255,255,.6),inset 0 0 0 1px rgba(255,255,255,.4)}
</style>
</helmet>
<div class="sf" style="width: 1280px; min-height: 1760px; box-sizing: border-box; padding: 40px; background: #0B0C0E; color: #F5F5F7; display: flex; flex-direction: column; gap: 28px;">
  <header style="display: flex; flex-direction: column; gap: 6px;">
    <h2 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 700;">Hover an inner wedge → ghost frame on screen</h2>
    <p style="margin: 0; font-size: 14px; line-height: 20px; color: rgba(235,235,245,.66);">The window's target frame is drawn live while the cursor sits on a wedge. Release runs it; moving to the centre clears the ghost.</p>
  </header>
  <sc-for list="{{scenes}}" as="s" hint-placeholder-count="2">
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 13px; font-weight: 600; color: rgba(235,235,245,.7);">{{s.title}}</div>
      <div class="{{s.cls}}" style="position: relative; width: 1200px; height: 750px; border-radius: 12px; overflow: hidden;">
        <dc-import name="Desktop" theme="{{s.cls}}" hint-size="1200px,750px"></dc-import>
        <div class="ghost" style="left: {{s.gl}}px; top: {{s.gt}}px; width: {{s.gw}}px; height: {{s.gh}}px; display: flex; align-items: center; justify-content: center;">
          <span style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 6px 0 12px; border-radius: 14px; background: var(--hud); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); box-shadow: 0 0 0 0.5px var(--hair); font-size: 12px; font-weight: 500; color: var(--label);">{{s.label}} <span style="font-size: 11px; color: var(--label2);">{{s.size}}</span></span>
        </div>
        <div style="position: absolute; left: {{s.wl}}px; top: {{s.wt}}px;">
          <dc-import name="Wheel" theme="{{s.cls}}" state="inner" pick="{{s.pick}}" hint-size="420px,460px"></dc-import>
        </div>
        <svg aria-hidden="true" width="18" height="22" viewBox="0 0 18 22" style="position: absolute; left: {{s.cl}}px; top: {{s.ct}}px;"><path d="M1.5 1.5v16l4.2-3.9 2.9 6.4 2.6-1.1-2.9-6.3h5.8z" fill="#000" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"></path></svg>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1760}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      scenes: [
        { title: 'Dark · cursor on Left Half', cls: 'dark', pick: 6, gl: 6, gt: 32, gw: 588, gh: 636, wl: 490, wt: 190, cl: 637, ct: 399, label: 'Left Half', size: '1720 × 1376' },
        { title: 'Light · cursor on Top Right quarter', cls: 'light', pick: 1, gl: 606, gt: 32, gw: 588, gh: 312, wl: 310, wt: 210, cl: 563, ct: 375, label: 'Top Right', size: '1720 × 688' }
      ]
    };
  }
}
</script>
</body>
</html>
