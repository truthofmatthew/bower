<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings · Snap Wheel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.sf{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.dark{--label:rgba(255,255,255,.92);--label2:rgba(235,235,245,.64);--label3:rgba(235,235,245,.38);--hair:rgba(255,255,255,.10);--fill:rgba(255,255,255,.07);--fill2:rgba(255,255,255,.14);--win:#1E1E20;--chrome:#2A2A2D;--group:rgba(255,255,255,.05);--control:#3A3A3E;--accent:#3FD3C2;--accentFill:rgba(63,211,194,.20);--onAccent:#04231F;--stage:#26282E;--shadow:0 24px 70px rgba(0,0,0,.6),0 0 0 .5px rgba(0,0,0,.9);color:var(--label)}
.light{--label:rgba(0,0,0,.88);--label2:rgba(60,60,67,.74);--label3:rgba(60,60,67,.40);--hair:rgba(0,0,0,.10);--fill:rgba(0,0,0,.045);--fill2:rgba(0,0,0,.09);--win:#F2F2F4;--chrome:#E6E6E9;--group:#FFFFFF;--control:#FFFFFF;--accent:#0B7A72;--accentFill:rgba(11,122,114,.14);--onAccent:#FFFFFF;--stage:#DCDFE6;--shadow:0 24px 70px rgba(0,0,0,.22),0 0 0 .5px rgba(0,0,0,.2);color:var(--label)}
.win{width:760px;height:560px;border-radius:12px;overflow:hidden;background:var(--win);box-shadow:var(--shadow);display:flex;flex-direction:column;font-size:13px;position:relative}
.chrome{background:var(--chrome);border-bottom:1px solid var(--hair);flex:none;position:relative}
.tl{position:absolute;left:14px;top:9px;display:flex;gap:8px}.tl span{width:12px;height:12px;border-radius:6px}
.ttl{height:30px;display:flex;align-items:center;justify-content:center;font-weight:600}
.tools{display:flex;justify-content:center;gap:2px;padding:0 0 6px}
.tool{width:78px;height:48px;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:inherit;font-size:11px;color:var(--label2);border:none;background:transparent}
.tool.sel{background:var(--fill2);color:var(--label)}.tool.sel svg{color:var(--accent)}
.content{flex:1;min-height:0;padding:14px 20px;display:flex;gap:16px;position:relative}
.gh{font-size:12px;font-weight:600;color:var(--label2);padding:0 2px}
.sub{font-size:11px;line-height:15px;color:var(--label2)}
.act{height:30px;box-sizing:border-box;border-radius:7px;background:var(--group);box-shadow:0 0 0 .5px var(--hair);display:flex;align-items:center;gap:7px;padding:0 9px;font:inherit;font-size:12px;color:var(--label);border:none;text-align:left;cursor:grab}
.act.used{color:var(--label3)}
.act.lift{box-shadow:0 0 0 1.5px var(--accent),0 12px 28px rgba(0,0,0,.35);background:var(--control)}
.btn{height:28px;padding:0 12px;border-radius:7px;background:var(--control);box-shadow:0 0 0 .5px var(--hair),0 1px 1.5px rgba(0,0,0,.14);border:none;font:inherit;color:var(--label);white-space:nowrap}
.lbl{font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:rgba(235,235,245,.6)}
</style>
</helmet>
<div class="sf" style="width: 1680px; min-height: 720px; box-sizing: border-box; padding: 40px 48px; background: #0B0C0E; display: flex; gap: 64px;">
  <sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <span class="lbl">{{t.name}}</span>
      <div class="win {{t.cls}}">
        <div class="chrome">
          <div class="tl"><span style="background: #FF5F57;"></span><span style="background: #FEBC2E;"></span><span style="background: #28C840;"></span></div>
          <div class="ttl">Snap Wheel</div>
          <div class="tools" role="tablist">
            <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="6">
              <button type="button" role="tab" class="tool {{tb.cls}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 20 20"><path d="{{tb.d}}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{tb.name}}</button>
            </sc-for>
          </div>
        </div>
        <div class="content">
          <div style="width: 400px; height: 448px; flex: none; border-radius: 10px; background: var(--stage); box-shadow: inset 0 0 0 .5px var(--hair); display: flex; align-items: center; justify-content: center;">
            <dc-import name="Wheel" theme="{{t.cls}}" state="edit" scale="{{s9}}" hint-size="378px,414px"></dc-import>
          </div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px;">
            <div class="gh">Actions · drag onto an outer slot</div>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px;">
              <sc-for list="{{actions}}" as="a" hint-placeholder-count="10">
                <button type="button" class="act {{a.cls}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><path d="{{a.d}}" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{a.name}}</button>
              </sc-for>
            </div>
            <p class="sub" style="margin: 2px 2px 0;">Greyed actions are already on the wheel. The inner ring always holds the eight snap targets. Drop onto the centre to cancel a drag.</p>
            <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 9px; background: var(--group); box-shadow: 0 0 0 .5px var(--hair);">
              <span style="font-weight: 600;">Slot 7 · hidden</span>
              <span class="sub">A hidden slot draws as an empty dashed wedge and does nothing on release.</span>
              <div style="display: flex; gap: 8px;"><button type="button" class="btn">Show Slot</button><button type="button" class="btn">Restore Defaults</button></div>
            </div>
          </div>
          <div class="act lift" style="position: absolute; left: 330px; top: 300px; width: 120px;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><path d="M2 3h12v10H2zM5.5 6h5v4h-5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path></svg>Center</div>
        </div>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1680,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const sel = 4;
    const T = [['General', 'M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4M10 6.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z'], ['Layouts', 'M3 3h6v6H3zM11 3h6v6h-6zM3 11h6v6H3zM11 11h6v6h-6z'], ['Displays', 'M2.5 3.5h15v10h-15zM7 17h6M10 13.5V17'], ['Shortcuts', 'M2 5.5h16v9H2zM5 8.5h1M8 8.5h1M11 8.5h1M14 8.5h1M6 11.5h8'], ['Snap Wheel', 'M10 2.5a7.5 7.5 0 1 0 0 15 7.5 7.5 0 0 0 0-15zM10 7a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM10 2.5V7M10 13v4.5M2.5 10H7M13 10h4.5'], ['AI', 'M5 2.5h7l3 3v12H5zM12 2.5v3h3M7.5 9.5h5M7.5 12h5M7.5 14.5h3']];
    const A = [
      ['Center', 'M2 3h12v10H2zM5.5 6h5v4h-5z', 'lift-src'], ['Almost Maximize', 'M2 3h12v10H2zM4 5h8v6H4z', ''], ['Next Display', 'M1.5 4h8v6h-8zM11 6.5h3.5M12.5 5l1.5 1.5-1.5 1.5', ''], ['Restore', 'M3 8a5 5 0 1 0 1.5-3.6M3 2.5V5h2.5', ''],
      ['Minimize', 'M3 12.5h10', ''], ['Hide Others', 'M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8s-2.4 4.5-6.5 4.5S1.5 8 1.5 8zM2.5 13.5l11-11', ''],
      ['Maximize', 'M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10', 'used'], ['Layouts ▸', 'M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z', 'used'],
      ['Window Mode ▸', 'M2 5h9v8.5H2zM5 5V2.5h9V11h-3', 'used'], ['Settings', 'M2 4.5h7.5M12.5 4.5H14M2 11.5h1.5M6.5 11.5H14M11 3v3M5 10v3', 'used']
    ];
    return {
      s9: 0.9,
      themes: [{ cls: 'dark', name: 'Dark' }, { cls: 'light', name: 'Light' }],
      tabs: T.map((x, i) => ({ name: x[0], d: x[1], cls: i === sel ? 'sel' : '' })),
      actions: A.map((x) => ({ name: x[0], d: x[1], cls: x[2] === 'lift-src' ? 'used' : x[2] }))
    };
  }
}
</script>
</body>
</html>
