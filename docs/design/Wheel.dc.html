<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snap Wheel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 420px; height: 460px; position: relative; zoom: {{scale}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; color: {{label}};">
  <div style="position: absolute; left: 60px; top: 60px; width: 300px; height: 300px; border-radius: 50%; background: {{hud}}; backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%); box-shadow: 0 0 0 0.5px {{line}}, 0 18px 48px {{shadow}};"></div>
  <sc-for list="{{sub}}" as="s" hint-placeholder-count="0">
    <svg aria-hidden="true" viewBox="-60 -60 420 420" width="420" height="420" style="position: absolute; left: 0; top: 0; overflow: visible;">
      <path d="{{s.d}}" fill="{{s.fill}}" stroke="{{s.stroke}}" stroke-width="{{s.sw}}"></path>
      <text x="{{s.tx}}" y="{{s.ty}}" text-anchor="middle" dominant-baseline="central" font-size="{{s.fs}}" font-weight="600" fill="{{s.tc}}">{{s.label}}</text>
    </svg>
  </sc-for>
  <sc-for list="{{inner}}" as="o" hint-placeholder-count="8">
    <svg aria-hidden="true" viewBox="-60 -60 420 420" width="420" height="420" style="position: absolute; left: 0; top: 0; overflow: visible;">
      <path d="{{o.d}}" fill="{{o.fill}}" stroke="{{o.stroke}}" stroke-width="{{o.sw}}"></path>
      <path d="{{o.ring}}" fill="none" stroke="{{accent}}" stroke-width="2"></path>
      <g transform="{{o.tf}}">
        <rect x="-9" y="-6" width="18" height="12" rx="2" fill="none" stroke="{{o.gs}}" stroke-width="1.2"></rect>
        <rect x="{{o.gx}}" y="{{o.gy}}" width="{{o.gw}}" height="{{o.gh}}" rx="0.75" fill="{{o.gf}}"></rect>
      </g>
    </svg>
  </sc-for>
  <sc-for list="{{outer}}" as="o" hint-placeholder-count="8">
    <svg aria-hidden="true" viewBox="-60 -60 420 420" width="420" height="420" style="position: absolute; left: 0; top: 0; overflow: visible;">
      <path d="{{o.d}}" fill="{{o.fill}}" stroke="{{o.stroke}}" stroke-width="{{o.sw}}" stroke-dasharray="{{o.dash}}"></path>
      <g transform="{{o.tf}}"><path d="{{o.icon}}" transform="translate(-8 -8)" fill="none" stroke="{{o.ic}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></g>
      <path d="{{o.chev}}" fill="{{o.ic}}"></path>
    </svg>
  </sc-for>
  <svg aria-hidden="true" viewBox="-60 -60 420 420" width="420" height="420" style="position: absolute; left: 0; top: 0; overflow: visible;">
    <circle cx="150" cy="150" r="32"fill="{{cFill}}" stroke="{{cStroke}}" stroke-width="1"></circle>
    <path d="M144.5 144.5l11 11M155.5 144.5l-11 11" fill="none" stroke="{{cX}}" stroke-width="1.6" stroke-linecap="round"></path>
  </svg>
  <div style="position: absolute; left: 0; right: 0; top: 422px; display: flex; justify-content: center;">
    <div style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 6px 0 12px; border-radius: 14px; background: {{capBg}}; backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); box-shadow: 0 0 0 0.5px {{line}}, 0 6px 18px {{shadow}}; font-size: 12px; font-weight: 500; color: {{capColor}}; white-space: nowrap;">
      <span>{{cap}}</span>
      <span style="font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 5px; background: {{fill2}}; color: {{label2}};">{{key}}</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"state":{"editor":"enum","options":["idle","inner","outer","submenu","mode","disabled","focus","edit"],"default":"inner"},"pick":{"editor":"int","min":0,"max":7,"default":null},"contrast":{"editor":"boolean","default":false},"scale":{"editor":"float","min":0.25,"max":2,"step":0.25,"default":1},"$preview":{"width":420,"height":460}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const dark = (p.theme ?? 'dark') !== 'light';
    const hc = p.contrast === true || p.contrast === 'true';
    const st = p.state ?? 'inner';
    const pick = p.pick != null && p.pick !== '' ? Number(p.pick) : null;
    const K = dark
      ? { hud: 'rgba(38,38,42,0.70)', hudHC: 'rgba(20,20,22,0.97)', fill: 'rgba(255,255,255,0.08)', fill2: 'rgba(255,255,255,0.16)', fillHC: 'rgba(255,255,255,0.12)', line: 'rgba(255,255,255,0.14)', lineHC: 'rgba(255,255,255,0.72)', label: '#F2F2F4', label2: 'rgba(235,235,245,0.62)', label3: 'rgba(235,235,245,0.28)', accent: '#3FD3C2', on: '#04231F', tint: 'rgba(63,211,194,0.24)', sub: 'rgba(44,44,48,0.94)', subCur: 'rgba(28,74,70,0.96)', shadow: 'rgba(0,0,0,0.45)', cap: 'rgba(30,30,34,0.86)' }
      : { hud: 'rgba(250,250,252,0.72)', hudHC: 'rgba(255,255,255,0.98)', fill: 'rgba(0,0,0,0.05)', fill2: 'rgba(0,0,0,0.10)', fillHC: 'rgba(0,0,0,0.07)', line: 'rgba(0,0,0,0.12)', lineHC: 'rgba(0,0,0,0.72)', label: '#1D1D1F', label2: 'rgba(60,60,67,0.72)', label3: 'rgba(60,60,67,0.30)', accent: '#0B7A72', on: '#FFFFFF', tint: 'rgba(11,122,114,0.16)', sub: 'rgba(250,250,252,0.96)', subCur: 'rgba(212,234,231,0.98)', shadow: 'rgba(0,0,0,0.22)', cap: 'rgba(255,255,255,0.9)' };
    const R = (n) => Math.round(n * 100) / 100;
    const rad = (d) => d * Math.PI / 180;
    const pt = (r, a) => R(150 + r * Math.cos(a)) + ' ' + R(150 + r * Math.sin(a));
    // constant 2 pt gap between wedges: half-gap of 1 pt converted to an angle at each radius
    const sector = (r0, r1, a0, a1) => 'M' + pt(r1, a0 + 1 / r1) + 'A' + r1 + ' ' + r1 + ' 0 0 1 ' + pt(r1, a1 - 1 / r1) + 'L' + pt(r0, a1 - 1 / r0) + 'A' + r0 + ' ' + r0 + ' 0 0 0 ' + pt(r0, a0 + 1 / r0) + 'Z';
    const tf = (r, a) => 'translate(' + pt(r, a) + ')';
    const base = hc ? K.fillHC : K.fill;
    const edge = hc ? K.lineHC : 'none';
    const ew = hc ? 1 : 0;
    const lab2 = hc ? K.label : K.label2;

    const IN = [['Top Half', [0, 0, 1, .5], '⌃⌥↑'], ['Top Right', [.5, 0, .5, .5], '⌃⌥I'], ['Right Half', [.5, 0, .5, 1], '⌃⌥→'], ['Bottom Right', [.5, .5, .5, .5], '⌃⌥K'], ['Bottom Half', [0, .5, 1, .5], '⌃⌥↓'], ['Bottom Left', [0, .5, .5, .5], '⌃⌥J'], ['Left Half', [0, 0, .5, 1], '⌃⌥←'], ['Top Left', [0, 0, .5, .5], '⌃⌥U']];
    const ICON = {
      max: 'M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10',
      thirds: 'M1.75 3.25h12.5v9.5H1.75zM5.9 3.25v9.5M10.1 3.25v9.5',
      mode: 'M2 5h9v8.5H2zM5 5V2.5h9V11h-3',
      layouts: 'M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z',
      send: 'M1.5 8h8.5M7 5l3 3-3 3M13.5 2.5v11',
      retile: 'M13.25 8A5.25 5.25 0 1 1 11.7 4.3M13.25 2.25V5.5H10',
      recipe: 'M3.5 1.75h6l3 3v9.5h-9zM9.5 1.75v3h3M5.75 8h4.5M5.75 10.5h4.5M5.75 13h2.5',
      settings: 'M2 4.5h7.5M12.5 4.5H14M2 11.5h1.5M6.5 11.5H14M11 3v3M5 10v3',
      plus: 'M8 3.5v9M3.5 8h9'
    };
    const OUT = [['Maximize', '⌃⌥↩', 'max', 0], ['Thirds', '⌃⌥D F G', 'thirds', 1], ['Window Mode', '', 'mode', 1], ['Layouts', '⌥1–9', 'layouts', 1], ['Send to Layout', '⇧⌥1–9', 'send', 1], ['Retile', '⌃⌥R', 'retile', 0], ['AI Recipe', '', 'recipe', 0], ['Settings', '⌘,', 'settings', 0]];

    const hovIn = st === 'inner' ? (pick ?? 6) : -1;
    const focIn = st === 'focus' ? 2 : -1;
    const hovOut = st === 'outer' ? (pick ?? 0) : -1;

    const inner = IN.map((w, i) => {
      const c = rad(-90 + 45 * i);
      const hov = i === hovIn, foc = i === focIn;
      const f = w[1];
      return {
        d: sector(40, 88, c - rad(22.5), c + rad(22.5)),
        fill: hov ? K.accent : foc ? K.tint : base,
        stroke: hov ? 'none' : edge, sw: hov ? 0 : ew,
        ring: foc ? sector(41, 87, c - rad(22.5), c + rad(22.5)) : '',
        tf: tf(64, c),
        gs: hov ? K.on : lab2,
        gf: hov ? K.on : foc ? K.accent : K.label,
        gx: R(-7 + f[0] * 14), gy: R(-4 + f[1] * 8), gw: R(f[2] * 14), gh: R(f[3] * 8)
      };
    });

    const outer = OUT.map((w, i) => {
      const c = rad(-90 + 45 * i);
      const hov = i === hovOut;
      const tinted = (st === 'submenu' && i === 3) || (st === 'mode' && i === 2);
      const disabled = st === 'disabled' && i === 6;
      const drop = st === 'edit' && i === 5;
      const hidden = st === 'edit' && i === 6;
      const ic = hov ? K.on : tinted || drop ? K.accent : disabled ? K.label3 : hidden ? K.label3 : K.label;
      const chev = w[3] && !hidden ? 'M' + pt(143, c) + 'L' + pt(137.5, c - 3 / 137.5) + 'L' + pt(137.5, c + 3 / 137.5) + 'Z' : '';
      return {
        d: sector(94, 146, c - rad(22.5), c + rad(22.5)),
        fill: hov ? K.accent : tinted || drop ? K.tint : hidden ? 'none' : disabled ? K.fill2 : base,
        stroke: hidden ? K.label3 : drop ? K.accent : hov ? 'none' : edge,
        sw: hidden || drop ? 1.5 : hov ? 0 : ew,
        dash: hidden || drop ? '4 3' : '',
        tf: tf(120, c),
        icon: hidden ? ICON.plus : ICON[w[2]],
        ic, chev
      };
    });

    let sub = [];
    if (st === 'submenu') {
      sub = [1, 2, 3, 4, 5, 6, 7, 8, 9].map((n, i) => {
        const c = rad(45 - 60 + 15 * i);
        const hov = i === 1, cur = i === 2;
        return { d: sector(154, 196, c - rad(7.5), c + rad(7.5)), fill: hov ? K.accent : cur ? K.subCur : K.sub, stroke: hc ? K.lineHC : K.line, sw: hc ? 1 : 0.5, tx: pt(175, c).split(' ')[0], ty: pt(175, c).split(' ')[1], fs: 14, tc: hov ? K.on : cur ? K.accent : n > 6 ? K.label3 : K.label, label: String(n) };
      });
    } else if (st === 'mode') {
      sub = ['Native', 'Bento', 'Tabs ✓'].map((n, i) => {
        const c = rad(-30 + 30 * i);
        const hov = i === 1, cur = i === 2;
        return { d: sector(154, 206, c - rad(15), c + rad(15)), fill: hov ? K.accent : cur ? K.subCur : K.sub, stroke: hc ? K.lineHC : K.line, sw: hc ? 1 : 0.5, tx: pt(180, c).split(' ')[0], ty: pt(180, c).split(' ')[1], fs: 12, tc: hov ? K.on : cur ? K.accent : K.label, label: n };
      });
    }

    const CAP = {
      idle: ['Release on an action', 'esc'],
      inner: [IN[hovIn] ? IN[hovIn][0] : '', IN[hovIn] ? IN[hovIn][2] : ''],
      outer: [OUT[hovOut] ? OUT[hovOut][0] : '', OUT[hovOut] ? OUT[hovOut][1] : ''],
      submenu: ['Layout 2 · Design', '⌥2'],
      mode: ['Bento Box on this display', '↩'],
      disabled: ['AI Recipe needs an endpoint · Settings › AI', '⌘,'],
      focus: ['Right Half · arrows move, Return runs', '↩'],
      edit: ['Drop “Center” to replace Retile', '']
    }[st] || ['', ''];

    return {
      scale: p.scale ?? 1,
      hud: hc ? K.hudHC : K.hud, line: hc ? K.lineHC : K.line, shadow: K.shadow,
      label: K.label, label2: K.label2, fill2: K.fill2, accent: K.accent,
      inner, outer, sub,
      cFill: base, cStroke: edge, cX: lab2,
      capBg: hc ? K.hudHC : K.cap, capColor: st === 'disabled' ? K.label2 : K.label,
      cap: CAP[0], key: CAP[1] || '·'
    };
  }
}
</script>
</body>
</html>
